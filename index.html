<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Carlos Condell · UTP y Gestión</title>
  <style>
    :root {
      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-column: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-soft: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --alta-bg: #fef2f2;
      --alta-border: #ef4444;
      --alta-text: #991b1b;
      --media-bg: #fffbeb;
      --media-border: #f59e0b;
      --media-text: #92400e;
      --baja-bg: #f0fdf4;
      --baja-border: #22c55e;
      --baja-text: #166534;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Calibri", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 13.5pt;
      background: var(--bg-app);
      color: var(--text-main);
      line-height: 1.4;
      min-height: 100vh;
    }

    .app-shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Encabezado superior */
    .topbar {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .badge-rbd {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .clock-pill {
      background: var(--bg-column);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.98rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .clock-time {
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    /* Grilla principal: 5 días + barra lateral */
    .workspace {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr)) 250px;
      gap: 14px;
      align-items: start;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .sidebar {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    /* Columnas de días */
    .day-col {
      background: var(--bg-column);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      min-height: 540px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .day-header {
      background: var(--bg-surface);
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .day-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .day-date {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .day-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Tarjetas de evento */
    .event-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-left: 4px solid var(--media-border);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      cursor: pointer;
    }

    .event-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .event-card.prio-alta {
      border-left-color: var(--alta-border);
    }

    .event-card.prio-media {
      border-left-color: var(--media-border);
    }

    .event-card.prio-baja {
      border-left-color: var(--baja-border);
    }

    .event-card.is-done {
      opacity: 0.62;
      background: #f8fafc;
    }

    .event-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .event-meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .time-chip {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    .prio-alta .time-chip {
      background: var(--alta-bg);
      color: var(--alta-text);
    }

    .prio-media .time-chip {
      background: var(--media-bg);
      color: var(--media-text);
    }

    .prio-baja .time-chip {
      background: var(--baja-bg);
      color: var(--baja-text);
    }

    .org-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 125px;
    }

    .check-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .event-card.is-done .check-btn {
      background: #16a34a;
      border-color: #16a34a;
      color: #ffffff;
    }

    .event-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .event-card.is-done .event-title {
      text-decoration: line-through;
    }

    .event-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Panel lateral */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .panel-title {
      font-size: 0.86rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .btn {
      width: 100%;
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 8px 11px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    .btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-soft-green {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }

    .nav-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .week-range {
      text-align: center;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-column);
      padding: 5px 8px;
      border-radius: 8px;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 8px 11px;
      font-family: inherit;
      font-size: 0.98rem;
      color: var(--text-main);
      background: var(--bg-column);
      outline: none;
    }

    .search-input:focus {
      background: #ffffff;
      border-color: var(--primary);
    }

    .status-toast {
      font-size: 0.88rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <h1 class="brand-title">Agenda Carlos Condell</h1>
        <span class="badge-rbd">San Bernardo · RBD 25078</span>
      </div>
      <div class="clock-pill" id="clockBox">
        <span id="fechaActual">Cargando fecha...</span>
        <span class="clock-time" id="horaActual">--:--:--</span>
      </div>
    </header>

    <main class="workspace">
      <section class="day-col" data-day="0">
        <div class="day-header"><span class="day-name">Lunes</span><span class="day-date" id="date-0"></span></div>
        <div class="day-body" id="col-0"></div>
      </section>

      <section class="day-col" data-day="1">
        <div class="day-header"><span class="day-name">Martes</span><span class="day-date" id="date-1"></span></div>
        <div class="day-body" id="col-1"></div>
      </section>

      <section class="day-col" data-day="2">
        <div class="day-header"><span class="day-name">Miércoles</span><span class="day-date" id="date-2"></span></div>
        <div class="day-body" id="col-2"></div>
      </section>

      <section class="day-col" data-day="3">
        <div class="day-header"><span class="day-name">Jueves</span><span class="day-date" id="date-3"></span></div>
        <div class="day-body" id="col-3"></div>
      </section>

      <section class="day-col" data-day="4">
        <div class="day-header"><span class="day-name">Viernes</span><span class="day-date" id="date-4"></span></div>
        <div class="day-body" id="col-4"></div>
      </section>

      <aside class="sidebar">
        <div class="panel-card">
          <div class="panel-title">Seguridad</div>
          <button class="btn btn-soft-green" id="btnModoEdicion">🔒 Modo edición</button>
        </div>

        <div class="panel-card">
          <div class="panel-title">Navegación semanal</div>
          <div class="week-range" id="rangoSemana">Semana actual</div>
          <div class="nav-row">
            <button class="btn" id="btnAnt">◀ Ant</button>
            <button class="btn" id="btnHoy">Hoy</button>
            <button class="btn" id="btnSig">Sig ▶</button>
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-title">Gestión de eventos</div>
          <button class="btn btn-primary" id="btnNuevoEvento">+ Nuevo evento</button>
          <button class="btn" id="btnAsistenteAIA">★ Asistente AIA</button>
          <button class="btn" id="btnSincronizar">↻ Sincronizar</button>
          <div class="status-toast" id="estadoSync">Listo</div>
        </div>

        <div class="panel-card">
          <div class="panel-title">Buscar compromiso</div>
          <input type="search" class="search-input" id="buscador" placeholder="Buscar por asunto o remitente..." />
        </div>
      </aside>
    </main>
  </div>

  <script>
    const SCRIPT_URL = "TU_URL_DE_WEB_APP_AQUI";

    let semanaOffset = 0;
    let edicionActiva = false;
    let eventosCargados = [];

    function actualizarReloj() {
      const ahora = new Date();
      const fechaStr = ahora.toLocaleDateString("es-CL", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
      document.getElementById("fechaActual").textContent =
        fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1);
      document.getElementById("horaActual").textContent =
        ahora.toLocaleTimeString("es-CL", { hour12: false });
    }

    function obtenerLunesDeSemana(offset) {
      const base = new Date();
      const dia = base.getDay();
      const diff = dia === 0 ? -6 : 1 - dia;
      const lunes = new Date(base);
      lunes.setDate(base.getDate() + diff + offset * 7);
      lunes.setHours(0, 0, 0, 0);
      return lunes;
    }

    function formatoISO(fechaObj) {
      const y = fechaObj.getFullYear();
      const m = String(fechaObj.getMonth() + 1).padStart(2, "0");
      const d = String(fechaObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function pintarCabecerasSemana() {
      const lunes = obtenerLunesDeSemana(semanaOffset);
      const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
      for (let i = 0; i < 5; i++) {
        const d = new Date(lunes);
        d.setDate(lunes.getDate() + i);
        document.getElementById(`date-${i}`).textContent = `${d.getDate()} ${meses[d.getMonth()]}`;
      }
      const viernes = new Date(lunes);
      viernes.setDate(lunes.getDate() + 4);
      document.getElementById("rangoSemana").textContent =
        `${lunes.getDate()} ${meses[lunes.getMonth()]} – ${viernes.getDate()} ${meses[viernes.getMonth()]}`;
    }

    function normalizarFechaEvento(raw) {
      const s = String(raw || "").trim();
      const isoMatch = s.match(/(\d{4}-\d{2}-\d{2})/);
      if (isoMatch) return isoMatch[1];
      const latMatch = s.match(/(\d{2})[/-](\d{2})[/-](\d{4})/);
      if (latMatch) return `${latMatch[3]}-${latMatch[2]}-${latMatch[1]}`;
      return "";
    }

    function extraerHoraEvento(raw) {
      const s = String(raw || "");
      const m = s.match(/(\d{2}:\d{2})/);
      return m ? m[1] : "09:00";
    }

    function renderizarEventos() {
      pintarCabecerasSemana();
      const filtro = document.getElementById("buscador").value.toLowerCase().trim();
      const lunes = obtenerLunesDeSemana(semanaOffset);
      const diasMap = {};

      for (let i = 0; i < 5; i++) {
        const d = new Date(lunes);
        d.setDate(lunes.getDate() + i);
        diasMap[formatoISO(d)] = i;
        document.getElementById(`col-${i}`).innerHTML = "";
      }

      const filtrados = eventosCargados.filter((ev) => {
        if (!filtro) return true;
        const txt = `${ev.asunto || ""} ${ev.remitente || ""} ${ev.sintesis || ""}`.toLowerCase();
        return txt.includes(filtro);
      });

      filtrados.forEach((ev) => {
        const fechaIso = normalizarFechaEvento(ev.fechaDoc);
        const colIdx = diasMap[fechaIso];
        if (colIdx === undefined) return;

        const prio = String(ev.prioridad || "Media").toLowerCase();
        const prioClass = prio === "alta" ? "prio-alta" : prio === "baja" ? "prio-baja" : "prio-media";
        const realizado = String(ev.estado || "").toLowerCase() === "realizado";
        const hora = extraerHoraEvento(ev.fechaDoc);

        const card = document.createElement("article");
        card.className = `event-card ${prioClass} ${realizado ? "is-done" : ""}`;
        card.innerHTML = `
          <div class="event-top">
            <div class="event-meta-left">
              <span class="time-chip">${hora}</span>
              <span class="org-label" title="${ev.remitente || ""}">${ev.remitente || "Gestión"}</span>
            </div>
            <button type="button" class="check-btn" title="Cambiar estado">${realizado ? "✓" : ""}</button>
          </div>
          <div class="event-title">${ev.asunto || "(Sin asunto)"}</div>
          ${ev.accionReq ? `<div class="event-sub">${ev.accionReq}</div>` : ""}
        `;

        card.querySelector(".check-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          alternarEstado(ev);
        });

        card.addEventListener("click", () => {
          alert(
            `Asunto: ${ev.asunto || "-"}\n` +
            `Organiza/Remitente: ${ev.remitente || "-"}\n` +
            `Prioridad: ${ev.prioridad || "Media"}\n` +
            `Síntesis: ${ev.sintesis || "-"}\n` +
            `Acción: ${ev.accionReq || "-"}`
          );
        });

        document.getElementById(`col-${colIdx}`).appendChild(card);
      });
    }

    async function alternarEstado(ev) {
      const nuevoEstado = String(ev.estado || "").toLowerCase() === "realizado" ? "Pendiente" : "Realizado";
      ev.estado = nuevoEstado;
      renderizarEventos();

      if (!SCRIPT_URL || SCRIPT_URL.startsWith("TU_URL")) return;
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            accion: "actualizar_estado",
            fila: ev.fila,
            asunto: ev.asunto,
            fechaDoc: ev.fechaDoc,
            nuevo_estado: nuevoEstado
          })
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function sincronizarAgenda() {
      const toast = document.getElementById("estadoSync");
      if (!SCRIPT_URL || SCRIPT_URL.startsWith("TU_URL")) {
        toast.textContent = "Conecta tu URL de Apps Script";
        renderizarEventos();
        return;
      }
      toast.textContent = "Sincronizando...";
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (data.status === "success") {
          eventosCargados = data.datos || [];
          renderizarEventos();
          toast.textContent = "Sincronizado";
        } else {
          toast.textContent = "Error al leer";
        }
      } catch (err) {
        toast.textContent = "Sin conexión";
      }
    }

    document.getElementById("btnModoEdicion").addEventListener("click", (e) => {
      edicionActiva = !edicionActiva;
      e.currentTarget.textContent = edicionActiva ? "🔓 Edición activa" : "🔒 Modo edición";
    });

    document.getElementById("btnAnt").addEventListener("click", () => {
      semanaOffset--;
      renderizarEventos();
    });

    document.getElementById("btnHoy").addEventListener("click", () => {
      semanaOffset = 0;
      renderizarEventos();
    });

    document.getElementById("btnSig").addEventListener("click", () => {
      semanaOffset++;
      renderizarEventos();
    });

    document.getElementById("btnSincronizar").addEventListener("click", sincronizarAgenda);
    document.getElementById("buscador").addEventListener("input", renderizarEventos);

    document.getElementById("btnNuevoEvento").addEventListener("click", () => {
      alert("Conecta aquí tu modal de Nuevo Evento o envía directo a doPost.");
    });

    document.getElementById("btnAsistenteAIA").addEventListener("click", () => {
      alert("Conecta aquí tu modal del Asistente Inteligente AIA (Groq + Gemini).");
    });

    actualizarReloj();
    setInterval(actualizarReloj, 1000);
    sincronizarAgenda();
  </script>
</body>
</html>
